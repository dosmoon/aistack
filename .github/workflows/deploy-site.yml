name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The Astro site's prebuild hook (site/scripts/sync-docs.mjs)
      # runs scripts/gen_api_reference.py and scripts/gen_config_reference.py
      # to refresh docs/public/{api/reference,reference/configuration.md}
      # from the live FastAPI app's OpenAPI spec and aistack/config.py
      # AST. They need Python with aistack's base deps importable; the
      # base deps are tiny (fastapi/pydantic/starlette/jinja2/httpx) and
      # all ASR/TTS/LLM heavy imports inside aistack are lazy, so this
      # step stays under ~30 s.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aistack base for doc generators
        run: pip install -e .
      - uses: withastro/action@v6
        with:
          path: ./site
          node-version: 22
          package-manager: pnpm@9    # 钉 v9,详见 dosmoon.github.io/docs/docs-system-plan.md

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
