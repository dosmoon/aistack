name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The Astro site's prebuild hook (site/scripts/sync-docs.mjs)
      # runs scripts/gen_api_reference.py and scripts/gen_config_reference.py
      # to refresh docs/public/{api/reference,reference/configuration.md}
      # from aistack source. Both generators are pure AST analysis —
      # they read aistack/api/* and aistack/config.py as text, so a
      # bare Python 3.10+ interpreter is sufficient. No `pip install`
      # needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: withastro/action@v6
        with:
          path: ./site
          node-version: 22
          package-manager: pnpm@9    # 钉 v9,详见 dosmoon.github.io/docs/docs-system-plan.md

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
