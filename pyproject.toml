[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistack"
version = "0.0.1"
description = "Localhost AI service for ASR and TTS, OpenAI-API-compatible."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dosmoon" }]
keywords = ["asr", "tts", "speech", "openai-compatible", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "python-multipart>=0.0.9",  # required by FastAPI for multipart/form-data uploads
    "jinja2>=3.1",  # /admin Web UI templates
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
# Heavy ML deps are opt-in. Each extra installs only what that ASR provider
# needs; users running TTS-only deployments do not pay for ASR weights.
# Known Windows install pitfalls (pyarrow/pandas/datasets pins for parakeet,
# torchaudio pin for sensevoice) are documented in docs/progress/local_ai.md.
asr-fasterwhisper = [
    "faster-whisper>=1.0",
]
asr-parakeet = [
    # The [cu12] extra constrains NeMo's CUDA-related deps (cuda-python,
    # numba-cuda) to the 12.x major. Without it, NeMo pulls cuda-bindings
    # 13.x by default, which on torch+cu12* installs leads to
    # "Could not load symbol cudnnGetLibConfig. Error code 127" during
    # model load and crashes the worker. Floor 2.7 because the cu12 extra
    # was added in NeMo 2.7.
    "nemo_toolkit[asr,cu12]>=2.7",
    # Windows pins captured during VideoCraft Phase L2.2 — re-validate
    # whenever bumping nemo_toolkit.
    "pyarrow==19.0.1",
    "pandas==2.3.3",
    "datasets==3.6.0",
]
asr-sensevoice = [
    "funasr==1.3.1",
    # torchaudio is a hidden dep of funasr.utils.load_utils — `pip install
    # funasr` alone does NOT pull it on Windows. Floor at 2.7 so the
    # bundled cuDNN exposes cudnnGetLibConfig — torch 2.5.1+cu121 ships
    # cuDNN 9.1.0 which is missing that symbol and crashes NeMo Parakeet
    # on first model load. torch 2.7.x+cu126 ships cuDNN 9.7.x which has
    # it. Keeping torchaudio in lockstep avoids torch/torchaudio version
    # drift.
    "torchaudio>=2.7",
    "soundfile",
]
asr-all = [
    "aistack[asr-fasterwhisper,asr-parakeet,asr-sensevoice]",
]

[project.urls]
Homepage = "https://github.com/dosmoon/aistack"
Repository = "https://github.com/dosmoon/aistack"
Issues = "https://github.com/dosmoon/aistack/issues"

[tool.setuptools.packages.find]
include = ["aistack*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
